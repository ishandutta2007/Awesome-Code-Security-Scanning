<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Background Dynamic Floating Particles */
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(280px); opacity: 0.1; }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .particle { animation: pulseParticle 4s infinite ease-in-out; }
    .particle-delay-1 { animation-delay: 1s; }
    .particle-delay-2 { animation-delay: 2s; }
    .scan-line { animation: scanLine 6s infinite linear; }
    .wave-line { stroke-dasharray: 10 15; animation: waveFlow 20s linear infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Animated Wave Lines -->
  <path class="wave-line" d="M -100 220 Q 300 120 700 250 T 1300 180" fill="none" stroke="#4f46e5" stroke-width="2" opacity="0.3"/>
  <path class="wave-line" d="M -100 80 Q 400 240 800 60 T 1300 120" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>

  <!-- Background Decorative Shield Graphic (Right Side) -->
  <g transform="translate(920, 45)" opacity="0.15">
    <path d="M100 0 L200 40 V120 C200 190 100 240 100 240 C100 240 0 190 0 120 V40 Z" fill="url(#accent-grad)"/>
  </g>
  <g transform="translate(945, 70)" opacity="0.25">
    <path d="M75 0 L150 30 V90 C150 142 75 180 75 180 C75 180 0 142 0 90 V30 Z" fill="none" stroke="#38bdf8" stroke-width="4"/>
  </g>

  <!-- Background Ambient Glowing Orbs -->
  <circle cx="200" cy="80" r="120" fill="url(#glow-grad)" class="particle"/>
  <circle cx="1000" cy="220" r="140" fill="url(#glow-grad)" class="particle particle-delay-1"/>

  <!-- Moving Scanning Beam Line in Background -->
  <line x1="50" y1="10" x2="1150" y2="10" stroke="#38bdf8" stroke-width="2" class="scan-line" filter="url(#glow)"/>

  <!-- Decorative Tech Dots / Nodes in Background -->
  <g opacity="0.4">
    <circle cx="150" cy="230" r="4" fill="#6366f1" class="particle"/>
    <line x1="150" y1="230" x2="220" y2="230" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="220" cy="230" r="3" fill="#a855f7" class="particle particle-delay-1"/>

    <circle cx="1050" cy="70" r="4" fill="#38bdf8" class="particle particle-delay-2"/>
    <line x1="980" y1="70" x2="1050" y2="70" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="980" cy="70" r="3" fill="#ec4899"/>
  </g>

  <!-- Foreground Content Container -->
  <!-- Tag / Pill -->
  <g transform="translate(80, 50)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="6" fill="#10b981"/>
    <text x="36" y="21" class="badge-text">CURATED SECURITY ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <text x="80" y="140" class="title">Awesome Code Security Scanning</text>

  <!-- Foreground Subtitle -->
  <text x="80" y="185" class="subtitle">Top SaaS Platforms &amp; Open-Source Engines for SAST, SCA, &amp; ASPM</text>

  <!-- Decorative Bottom Gradient Accent Bar -->
  <rect x="80" y="225" width="480" height="4" rx="2" fill="url(#accent-grad)"/>

  <!-- Metric Badges Foreground Overlay -->
  <g transform="translate(80, 245)" opacity="0.9">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" font-weight="600">SAST • SCA • SECRETS • ASPM • IAC</text>
  </g>
</svg>
